name: Android build

# Builds a test APK (install on a phone) and a release bundle (.aab) in GitHub's free
# cloud, so nothing has to be installed on your own computer.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build debug APK (for installing on your phone)
        run: flutter build apk --debug
      - name: Build release bundle (.aab, debug-signed unless key.properties exists)
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: habit-recovery-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: habit-recovery-aab
          path: build/app/outputs/bundle/release/app-release.aab
