name: Android build

# Builds a test APK (install on a phone) and a release bundle (.aab) in GitHub's free
# cloud, so nothing has to be installed on your own computer.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# One build at a time per branch; a newer push cancels the older one.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build debug APK (for installing on your phone)
        run: flutter build apk --debug
      - name: Set up upload key (only when the UPLOAD_KEYSTORE_BASE64 secret exists)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$UPLOAD_KEY_PASSWORD" "$UPLOAD_KEY_PASSWORD" > android/key.properties
          fi
      - name: Check upload key - file decodes to a keystore
        run: |
          if [ -f android/app/upload-keystore.jks ]; then
            test "$(wc -c < android/app/upload-keystore.jks)" -eq 2648
          fi
      - name: Check upload key - password opens it
        run: |
          if [ -f android/key.properties ]; then
            PW=$(grep '^storePassword=' android/key.properties | cut -d= -f2-)
            keytool -list -keystore android/app/upload-keystore.jks -storepass "$PW" -alias upload >/dev/null
          fi
      - name: Export the PUBLIC upload certificate (safe to share; no private key)
        run: |
          if [ -f android/key.properties ]; then
            PW=$(grep '^storePassword=' android/key.properties | cut -d= -f2-)
            keytool -exportcert -rfc -keystore android/app/upload-keystore.jks -storepass "$PW" -alias upload -file upload_certificate.pem
            keytool -printcert -file upload_certificate.pem | grep -E 'SHA1|SHA256'
          fi
      - uses: actions/upload-artifact@v4
        if: hashFiles('upload_certificate.pem') != ''
        with:
          name: upload-certificate-pem
          path: upload_certificate.pem
      - name: Build release bundle (.aab, debug-signed unless key.properties exists)
        env:
          ORG_GRADLE_PROJECT_admobAppId: ca-app-pub-6048608609640389~5313476703
        run: flutter build appbundle --release --dart-define=ADMOB_BANNER_UNIT_ID=ca-app-pub-6048608609640389/8346834157
      - name: Verify the bundle is signed with the upload key (only when key.properties exists)
        run: |
          if [ -f android/key.properties ]; then
            keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -q "SHA256: BB:95:F8:B9:D7:58:35:70:8D:FD:25:21:1B:61:B7:70:3B:74:60:3E:F0:3A:C6:EF:A8:3A:0B:4C:63:5F:2E:9F"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: habit-recovery-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: habit-recovery-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Publish the test APK as a one-tap download (Releases page)
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk habit-recovery-test.apk
          gh release delete preview --cleanup-tag --yes || true
          gh release create preview habit-recovery-test.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Habit Recovery test build" \
            --notes "Test APK (debug-signed, test ads). Install it on an Android phone. Built from $GITHUB_SHA."
